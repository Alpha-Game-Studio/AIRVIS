[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airvis"
version = "7.0.0"
description = "AIRVIS OpenClaw AI orchestration engine"
requires-python = ">=3.10"
dependencies = [
	"numpy>=1.24,<3",
	"python-dotenv>=1.0,<2",
	"websockets>=13",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
airvis = "airvis.cli:main"
airvis-claw = "airvis.openclaw_cli:main"

[tool.setuptools.packages.find]
include = ["airvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
	"ignore::DeprecationWarning:airvis.*",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]
ignore = [
	"BLE001",
	"RUF012",
	"RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["airvis.tools.*", "airvis.providers.*", "airvis.backends.*"]
disable_error_code = ["override"]
